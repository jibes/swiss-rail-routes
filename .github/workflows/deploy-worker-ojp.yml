name: Deploy OJP Worker

on:
  push:
    branches: [main]
    paths:
      - workers/ojp/**
      - src/core/ojp/**
      - package-lock.json
      - .github/workflows/deploy-worker-ojp.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: worker-ojp
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          missing=0
          for v in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            [ -n "${!v}" ] || { echo "::error::Repo secret $v is not set"; missing=1; }
          done
          exit $missing

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # wrangler comes from the lockfile; no third-party action to pin. The token is set on this
      # step only, so npm ci's install scripts never see it.
      - run: npx wrangler deploy -c workers/ojp/wrangler.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
