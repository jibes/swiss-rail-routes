name: CI

on:
  pull_request:
  # data.yml starts it on its branch: a pull request it opens gets no checks of its own.
  workflow_dispatch:
  # main is checked by deploy.yml, which calls this workflow
  workflow_call:
    inputs:
      base:
        description: Base path for the build (e.g. /repo/)
        type: string
        default: ./

permissions:
  contents: read

concurrency:
  # github.workflow is the caller when called, so deploy.yml and deploy-worker-*.yml never cancel each other.
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Build and e2e must agree on the base path, or Playwright opens a 404.
      VITE_BASE: ${{ inputs.base || './' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci || (sleep 15 && npm ci) # once more on a network error
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test

      - name: Build
        run: npm run build
        env:
          # e2e answers this host from recorded OJP answers (e2e/plan.spec.ts).
          VITE_OJP_URL: https://ojp.invalid

      # Ubuntu's mirrors failing (DNS, 11 Nov 2026) must not stop a release: the browser first,
      # then its system packages for at most two minutes (each unreachable mirror waits 20 s a
      # package); without them the runner image's own libraries serve (only extra fonts miss).
      # The browser kept between runs (each one downloaded it anew), by Playwright's own version:
      # not the lock file's hash, which every release's version bump changes (second audit).
      - uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('node_modules/playwright-core/package.json') }}
      - name: Install Chromium
        run: |
          npx playwright install chromium
          timeout 120 npx playwright install-deps chromium || echo "::warning::system packages for Chromium not installed (mirrors unreachable)"
      - run: npm run e2e

      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
