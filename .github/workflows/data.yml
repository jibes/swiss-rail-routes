name: Data

# Monthly DIDOK stop index and GA exceptions (OSDM fares). Commits only when the data changed, then deploys
# (a push by GITHUB_TOKEN does not start other workflows, so this dispatches the deploy).
on:
  schedule:
    - cron: '17 3 2 * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: data
  cancel-in-progress: false

jobs:
  stops:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm run data:stops
      - run: npm run data:ga
      - run: npx vitest run tests/stops.test.ts tests/data.test.ts tests/acceptance.test.ts

      - name: Commit if changed
        id: commit
        run: |
          if git diff --quiet public/data src/data/ga.json; then
            echo "No change"; echo "changed=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -am "Data: stops $(jq -r .date public/data/stops.v1.json), GA $(jq -r .version src/data/ga.json)"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - if: steps.commit.outputs.changed == 'true'
        run: gh workflow run deploy.yml --ref main
        env:
          GH_TOKEN: ${{ github.token }}
