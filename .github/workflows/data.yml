name: Data

# Monthly DIDOK stop index and GA exceptions (OSDM fares). When the data changed, opens (or
# refreshes) one pull request from the branch `data`: merging it to main is the owner's push,
# with the version bump that releases the app (a push by GITHUB_TOKEN would start no release).
on:
  schedule:
    - cron: '17 3 2 * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: data
  cancel-in-progress: false

jobs:
  stops:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
      # To start CI on the data branch (a pull request made with this token starts none).
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm run data:stops
      - run: npm run data:ga
      - run: npx vitest run tests/stops.test.ts tests/data.test.ts tests/acceptance.test.ts

      - name: Pull request if changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet public/data src/data/ga.json; then
            echo "No change"; exit 0
          fi
          title="Data: stops $(jq -r .date public/data/stops.v1.json), GA $(jq -r .version src/data/ga.json)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -B data
          git commit -am "$title"
          # The bot's own branch: replaced on every run that finds a change.
          git push --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" data
          if [ -z "$(gh pr list --head data --state open --json number --jq '.[0].number')" ]; then
            gh pr create --base main --head data --title "$title" \
              --body "Monthly stop index and GA exceptions, from data.yml. Checks ran on the data (stops, data, acceptance); the whole CI runs on the branch too. Merge with a version bump (\`npm version patch --no-git-tag-version\`) so the app releases with the new data."
          else
            gh pr edit data --title "$title"
          fi
          # Its checks: the whole CI (typecheck, unit, e2e) on the new data, shown on the pull request.
          gh workflow run ci.yml --ref data
