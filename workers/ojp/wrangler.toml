# Deployed by .github/workflows/deploy-worker-ojp.yml. Secret OJP_API_KEY: `npx wrangler secret put OJP_API_KEY -c workers/ojp/wrangler.toml`.
name = "srr-ojp"
main = "src/index.ts"
compatibility_date = "2026-11-01"
workers_dev = true
observability = { enabled = false }

[vars]
OJP_URL = "https://api.opentransportdata.swiss/ojp20"
# OJP Fare (beta): the OJP 2.0 endpoint, its own key: `npx wrangler secret put OJP_FARE_API_KEY -c workers/ojp/wrangler.toml`.
OJP_FARE_URL = "https://api.opentransportdata.swiss/ojp20"
# Europe (0.30.0): Transitous, community-run; asked by the Worker alone, trains only.
TRANSITOUS_URL = "https://api.transitous.org"
# https://localhost: the Android app (Capacitor). Local dev servers are not here: `npm run
# worker:dev` adds them with --var, so no page on anyone's localhost can spend the key.
ALLOWED_ORIGINS = "https://jibes.github.io,https://localhost"

# 120 uncached requests a minute per client IP (a 4-leg arrive-by tour can need ~80).
[[ratelimits]]
name = "LIMIT"
namespace_id = "1001"
simple = { limit = 120, period = 60 }

# Sync writes: 10 a minute per client IP (a device writes a few times an hour). Storage of
# boxes anyone can create is the one thing here that costs: this keeps filling it slow.
[[ratelimits]]
name = "WRITES"
namespace_id = "1002"
simple = { limit = 10, period = 60 }

# Sync: one Durable Object (SQLite-backed, free plan) per sync id, holding one encrypted blob.
[[durable_objects.bindings]]
name = "SYNC"
class_name = "SyncBox"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["SyncBox"]
